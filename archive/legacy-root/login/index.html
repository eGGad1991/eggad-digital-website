<!DOCTYPE html>

<html lang="de">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1, viewport-fit=cover" name="viewport"/>
<meta content="#211c30" name="theme-color"/>
<meta content="noindex,nofollow" name="robots"/>
<title>Mila · Admin-Login</title>
<link href="login.css" rel="stylesheet"/>
</head>
<body>
<main class="page">
<a class="brand" href="/">mila<span>♡</span></a>
<div class="utility-links"><a href="/">← Zurück zur Website</a><a href="/galerie.html">Galerie ansehen</a></div>
<p class="eyebrow">PRIVATER BEREICH</p>
<section aria-labelledby="title" class="card">
<div aria-hidden="true" class="lock">⌑</div>
<h1 id="title">Schön, dass du da bist.</h1>
<p class="intro">Melde dich an, um Milas Bilder und Galerie zu verwalten.</p>
<form id="login-form">
<label for="email">E-Mail-Adresse</label>
<input autocomplete="username" id="email" inputmode="email" name="email" placeholder="name@beispiel.de" required="" type="email"/>
<label for="password">Passwort</label>
<input autocomplete="current-password" id="password" name="password" placeholder="Dein Passwort" required="" type="password"/>
<button id="login-button" type="submit">Anmelden</button>
</form>
<p aria-live="polite" class="message" id="message" role="status"></p>
<div class="bottom-links">
<a href="/upload/">Direkt zum Bilder-Upload</a>
<a href="/">Zurück zu Milas Website</a>
</div>
</section>
<p class="note">Nur für die Verwaltung der Mila-Galerie. Der Zugang ist geschützt.</p>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/supabase-config.js"></script>
<script src="login.js"></script>
</body>
</html>

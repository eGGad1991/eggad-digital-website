<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Tag 2 – Zwischen einem Lächeln und der Wirklichkeit | Entwurf</title>
<link href="/styles.css" rel="stylesheet">
<style>
.draft-note{margin:24px auto;padding:12px 16px;max-width:820px;border:1px solid #d9a441;border-radius:10px;color:#f1d9a2;background:#332817;font-size:14px}
.story-article{max-width:820px;margin:36px auto 80px;padding:0 18px}.story-title{font:600 clamp(34px,5vw,52px)/1.15 'Playfair Display',Georgia,serif;color:#fff;margin:18px 0 28px}
.story-copy{font:17px/1.9 'DM Sans',Arial,sans-serif;color:#e5dce8}.story-copy p{color:#d8cedd;margin:0 0 20px}
.story-image-slot{margin:34px 0 40px}.image-placeholder{min-height:240px;border:1px dashed #bd8bff88;border-radius:15px;background:radial-gradient(ellipse at 50% 35%,#56354e,#201a2b 75%);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;padding:24px;color:#fff}
.image-placeholder strong{font:600 25px 'Playfair Display',Georgia,serif}.image-placeholder span{font-size:13px;color:#c9bfd0}.story-image-slot figcaption{text-align:center;color:#a99caf;font-size:12px;margin-top:9px}
.story-end{margin-top:42px;padding-top:22px;border-top:1px solid #ffffff20;color:#bcb4c6;font-size:13px}@media(max-width:650px){.story-copy{font-size:16px}}
</style></head><body>
<header><div class="bar"><a class="logo" href="/">mila<span>♡</span></a><nav><a href="/">Startseite</a><a href="/dark-romance/">Dark Romance</a></nav></div></header>
<main class="wrap"><div class="draft-note">ENTWURF · NICHT VERÖFFENTLICHT · Nur zur internen Prüfung</div>
<article class="story-article"><a href="/dark-romance/">← Zurück zur Übersicht</a><h1 class="story-title">Tag 2 – Zwischen einem Lächeln und der Wirklichkeit</h1><div class="story-copy" id="story-copy"></div><div class="story-end">Ende von Tag 2 · Entwurf</div></article></main>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/supabase-config.js"></script>
<script>
(async()=>{const r=await fetch('./tag-2.md');const md=await r.text();const root=document.getElementById('story-copy');root.innerHTML=marked.parse(md);
const slots=[
{needle:'Änni lächelte – nicht überschwänglich',title:'Wiedersehen vor dem Hotel',desc:'Mila und Änni treffen sich nach dem Theater vor dem Hotel.',caption:'Ein Wiedersehen, auf das Mila gewartet hatte.'},
{needle:'Das Café lag in einer Seitenstraße',title:'Ein Abend zu zweit im Café',desc:'Mila sitzt mit ihrem Kaffee am Fenster; Änni ihr gegenüber.',caption:'Für einen Moment wirkt alles leicht und unbeschwert.'},
{needle:'Mila schloss auf und hielt die Tür offen',title:'Der Abschied an der Hotelzimmertür',desc:'Ein letzter Kuss im warm beleuchteten Hotelflur.',caption:'Ein Abschied, der mehr offenlässt als er beantwortet.'}
];
for(const s of slots){const p=[...root.querySelectorAll('p')].find(x=>x.textContent.includes(s.needle));if(!p)continue;const f=document.createElement('figure');f.className='story-image-slot';f.dataset.scene=s.title;f.innerHTML='<div class="image-placeholder"><strong>'+s.title+'</strong><span>'+s.desc+'</span></div><figcaption>'+s.caption+'</figcaption>';p.after(f);}
try {
 const cfg=window.MILA_SUPABASE_CONFIG||{};
 if(window.supabase&&cfg.url&&cfg.anonKey){
  const client=window.supabase.createClient(cfg.url,cfg.anonKey);
  const {data,error}=await client.from('dark_romance_images').select('scene_key,title,public_url,alt_text,sort_order').eq('day_number',2).eq('image_position','scene').order('sort_order',{ascending:true});
  if(!error&&data) data.forEach(item=>{
   const slot=root.querySelectorAll('.story-image-slot')[Number(item.scene_key.replace('scene-',''))-1];
   if(!slot)return;
   const img=document.createElement('img');img.src=item.public_url;img.alt=item.alt_text||item.title;img.loading='lazy';img.decoding='async';img.style.cssText='display:block;width:100%;height:auto;max-height:620px;object-fit:cover;border-radius:15px';
   slot.replaceChildren(img,slot.querySelector('figcaption'));
  });
 }
} catch(e){console.warn('Tag-2-Bilder konnten nicht geladen werden.',e);}
})();
</script></body></html>

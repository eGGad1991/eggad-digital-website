<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#8055a5">
  <title>Newsletter | Mila Einfach</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; padding: 24px;
      display: grid; place-items: center;
      background: #f7f4fa; color: #30283a;
      font-family: Arial, Helvetica, sans-serif;
    }
    main {
      width: 100%; max-width: 520px; padding: 38px 30px;
      border-radius: 18px; background: #fff; text-align: center;
      box-shadow: 0 12px 36px rgba(48, 36, 60, .08);
    }
    .symbol { margin-bottom: 12px; font-size: 34px; }
    h1 { margin: 0 0 18px; color: #8055a5; font-size: 29px; }
    #message {
      margin: 0 auto 20px; max-width: 390px; color: #6d6575;
      font-size: 16px; line-height: 1.7;
    }
    .button {
      display: inline-block; margin-top: 8px; padding: 12px 20px;
      border-radius: 9px; background: #8055a5; color: #fff;
      font-weight: 700; text-decoration: none;
    }
    .button:hover { background: #68418d; }
    .small { margin-top: 22px; color: #91899a; font-size: 12px; line-height: 1.5; }
  </style>
</head>
<body>
  <main>
    <div class="symbol" aria-hidden="true">💜</div>
    <h1>Mila Einfach</h1>
    <p id="message" role="status" aria-live="polite">Deine Anfrage wird geöffnet …</p>
    <a class="button" id="continue" href="https://mila-einfach.pages.dev/blog/">Zum Mila-Blog</a>
    <p class="small">Du wirst direkt zum Bestätigungsdienst weitergeleitet.</p>
  </main>
  <script>
    (() => {
      "use strict";
      const API = "https://script.google.com/macros/s/AKfycbyrNaA7YIQdaPNIU5jlIAqhzkMnR8HDMhmCs43EMEG8MyqRAGHYQjeDON_fVfiTMkBHyw/exec";
      const params = new URLSearchParams(window.location.search);
      const token = (params.get("token") || "").trim();
      const action = (params.get("action") || "confirm").trim();
      const message = document.getElementById("message");
      const link = document.getElementById("continue");

      if (!token || !["confirm", "unsubscribe"].includes(action)) {
        message.textContent = "Der Link ist unvollständig oder ungültig. Bitte verwende den vollständigen Link aus deiner E-Mail.";
        return;
      }

      const target = new URL(API);
      target.searchParams.set("action", action);
      target.searchParams.set("token", token);
      link.href = target.toString();
      link.textContent = action === "unsubscribe"
        ? "Abmeldelink direkt öffnen"
        : "Bestätigungslink direkt öffnen";

      // Normale Navigation statt fetch(): Google Apps Script darf die Anfrage
      // selbst beantworten und wird nicht durch die Browser-CORS-Regel blockiert.
      window.location.replace(target.toString());
    })();
  </script>
</body>
</html>
